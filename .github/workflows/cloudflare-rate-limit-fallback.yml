# Preview-trigger verification: this workflow deploys the dedicated cloudflare branch only to Cloudflare Pages.
name: Cloudflare fallback (Vercel rate limit only)

on:
  push:
    branches:
      - main
      - cloudflare

permissions:
  contents: read
  statuses: read

concurrency:
  group: cloudflare-fallback-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  check-vercel-rate-limit:
    name: Check Vercel deployment status
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Wait for Vercel status and detect rate-limit failures
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            // The dedicated cloudflare branch is a manual preview lane and should
            // deploy on every push without depending on Vercel status checks.
            if (context.ref === 'refs/heads/cloudflare') {
              core.info('Dedicated Cloudflare preview branch detected; deploy preview.');
              core.setOutput('deploy', 'true');
              core.setOutput('reason', 'Dedicated Cloudflare preview branch');
              return;
            }

            const sha = context.sha;
            const expectedContexts = ['Vercel – portfolio', 'Vercel – daley'];
            const deadline = Date.now() + 15 * 60 * 1000;

            core.info(`Checking Vercel statuses for commit ${sha}`);
            while (Date.now() < deadline) {
              const response = await github.rest.repos.getCombinedStatusForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
              });
              const statuses = response.data.statuses || [];
              const vercelStatuses = statuses.filter(status =>
                expectedContexts.includes(status.context)
              );

              const limited = vercelStatuses.find(status =>
                status.state === 'failure' &&
                typeof status.target_url === 'string' &&
                status.target_url.toLowerCase().includes('build-rate-limit')
              );

              if (limited) {
                core.warning(`Explicit Vercel build-rate-limit detected in ${limited.context}; Cloudflare fallback will deploy.`);
                core.setOutput('deploy', 'true');
                core.setOutput('reason', `Rate limit reported by ${limited.context}`);
                return;
              }

              const allExpectedSeen = expectedContexts.every(name =>
                vercelStatuses.some(status => status.context === name)
              );
              const allExpectedFinished = allExpectedSeen && expectedContexts.every(name => {
                const status = vercelStatuses.find(item => item.context === name);
                return status && status.state !== 'pending';
              });

              if (allExpectedFinished) {
                core.info('Vercel checks finished without an explicit build-rate-limit failure. Cloudflare will remain idle.');
                core.setOutput('deploy', 'false');
                core.setOutput('reason', 'Vercel succeeded or failed for a reason other than build-rate-limit');
                return;
              }

              core.info(`Waiting for Vercel checks. Found ${vercelStatuses.length}/${expectedContexts.length} expected status checks.`);
              await new Promise(resolve => setTimeout(resolve, 20000));
            }

            core.warning('Timed out waiting for Vercel statuses. Fail-closed: Cloudflare will not deploy.');
            core.setOutput('deploy', 'false');
            core.setOutput('reason', 'Timed out waiting for Vercel statuses');

  deploy-cloudflare-fallback:
    name: Deploy fallback to Cloudflare Pages
    needs: check-vercel-rate-limit
    if: >-
      needs.check-vercel-rate-limit.outputs.deploy == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cloudflare')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare static portfolio files and Cloudflare routing rules
        run: |
          mkdir -p /tmp/portfolio-site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='project-plan/' \
            --exclude='*.md' \
            --exclude='.gitignore' \
            ./ /tmp/portfolio-site/

          # Vercel's vercel.json is not applied by Cloudflare Pages. Convert its
          # existing headers and redirects to the equivalent Pages files.
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const output = '/tmp/portfolio-site';

          const headerLines = [];
          for (const rule of (config.headers || [])) {
            const source = rule.source === '/(.*)' ? '/*' : rule.source;
            headerLines.push(source);
            for (const header of rule.headers || []) {
              headerLines.push(`  ${header.key}: ${header.value}`);
            }
            headerLines.push('');
          }
          if (headerLines.length) {
            fs.writeFileSync(`${output}/_headers`, headerLines.join('\n').trimEnd() + '\n');
          }

          const redirectLines = [];
          for (const rule of (config.redirects || [])) {
            let source = rule.source;
            let destination = rule.destination;
            if (source === '/quiz/(.*)') {
              source = '/quiz/*';
              destination = destination.replace('$1', ':splat');
            } else if (source === '/ai/newsletter/:slug') {
              source = '/ai/newsletter/*';
              destination = destination.replace(':slug', ':splat');
            }
            const status = rule.permanent ? 301 : 302;
            redirectLines.push(`${source} ${destination} ${status}`);
          }
          if (redirectLines.length) {
            fs.writeFileSync(`${output}/_redirects`, redirectLines.join('\n') + '\n');
          }
          NODE

      - name: Verify homepage exists before deploying
        run: |
          test -s /tmp/portfolio-site/index.html || {
            echo "::error::Refusing to deploy: /tmp/portfolio-site/index.html is missing or empty."
            exit 1
          }

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3c6d26004c03dac0c3f2dc6834b7bd56
          COMMIT_SHA: ${{ github.sha }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Portfolio fallback deployment' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing repository Actions secret CLOUDFLARE_API_TOKEN. Add a Cloudflare API token with Account > Cloudflare Pages > Edit permission."
            exit 1
          fi

          npx --yes wrangler@4 pages deploy /tmp/portfolio-site \
            --project-name=daleymottley-portfolio-fallback \
            --branch="$DEPLOY_BRANCH" \
            --commit-hash="$COMMIT_SHA" \
            --commit-message="$COMMIT_MESSAGE"
