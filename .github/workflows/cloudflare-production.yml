name: Deploy portfolio to Cloudflare Pages production

on:
  push:
    branches:
      - cloudflare
    paths:
      - '**'
      - '!**/*.md'
      - '!.github/workflows/cloudflare-pr-previews.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy current cloudflare branch to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the merged source
        uses: actions/checkout@v4

      - name: Prepare static files and Pages routing rules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/portfolio-site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='project-plan/' \
            --exclude='*.md' \
            --exclude='.gitignore' \
            ./ /tmp/portfolio-site/

          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const output = '/tmp/portfolio-site';

          const headerLines = [];
          for (const rule of (config.headers || [])) {
            const source = rule.source === '/(.*)' ? '/*' : rule.source;
            headerLines.push(source);
            for (const header of rule.headers || []) {
              headerLines.push(`  ${header.key}: ${header.value}`);
            }
            headerLines.push('');
          }
          if (headerLines.length) {
            fs.writeFileSync(`${output}/_headers`, headerLines.join('\n').trimEnd() + '\n');
          }

          const redirectLines = [];
          for (const rule of (config.redirects || [])) {
            let source = rule.source;
            let destination = rule.destination;
            if (source === '/quiz/(.*)') {
              source = '/quiz/*';
              destination = destination.replace('$1', ':splat');
            } else if (source === '/ai/newsletter/:slug') {
              source = '/ai/newsletter/*';
              destination = destination.replace(':slug', ':splat');
            }
            redirectLines.push(`${source} ${destination} ${rule.permanent ? 301 : 302}`);
          }

          for (const rule of (config.rewrites || [])) {
            if (rule.source === '/bookings' && rule.destination === '/bookings.html') {
              redirectLines.push('/bookings /bookings.html 200');
            }
          }

          fs.writeFileSync(`${output}/_redirects`, [...new Set(redirectLines)].join('\n') + '\n');
          NODE

          test -s /tmp/portfolio-site/index.html
          test -s /tmp/portfolio-site/bookings.html
          test -s /tmp/portfolio-site/functions/api/latest-article.js

      - name: Deploy to Cloudflare Pages production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository Actions secret."
            exit 1
          fi
          npx --yes wrangler@4 pages deploy /tmp/portfolio-site \
            --project-name=daleymottley-portfolio-fallback \
            --branch=cloudflare \
            --commit-hash="$COMMIT_SHA" \
            --commit-message="$COMMIT_MESSAGE"
