name: Cloudflare Pages PR previews

on:
  pull_request:
    branches:
      - cloudflare
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy PR ${{ github.event.pull_request.number }} preview
    # Do not expose Cloudflare credentials to forked repositories.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare static portfolio files and Cloudflare routing rules
        shell: bash
        run: |
          mkdir -p /tmp/portfolio-site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='project-plan/' \
            --exclude='*.md' \
            --exclude='.gitignore' \
            ./ /tmp/portfolio-site/

          # Cloudflare Pages does not apply vercel.json. Convert the existing
          # Vercel headers and redirects into the equivalent Pages files.
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const output = '/tmp/portfolio-site';

          const headerLines = [];
          for (const rule of (config.headers || [])) {
            const source = rule.source === '/(.*)' ? '/*' : rule.source;
            headerLines.push(source);
            for (const header of rule.headers || []) {
              headerLines.push(`  ${header.key}: ${header.value}`);
            }
            headerLines.push('');
          }
          if (headerLines.length) {
            fs.writeFileSync(`${output}/_headers`, headerLines.join('\n').trimEnd() + '\n');
          }

          const redirectLines = [];
          for (const rule of (config.redirects || [])) {
            let source = rule.source;
            let destination = rule.destination;
            if (source === '/quiz/(.*)') {
              source = '/quiz/*';
              destination = destination.replace('$1', ':splat');
            } else if (source === '/ai/newsletter/:slug') {
              source = '/ai/newsletter/*';
              destination = destination.replace(':slug', ':splat');
            }
            redirectLines.push(`${source} ${destination} ${rule.permanent ? 301 : 302}`);
          }
          if (redirectLines.length) {
            fs.writeFileSync(`${output}/_redirects`, redirectLines.join('\n') + '\n');
          }
          NODE

      - name: Verify required files
        run: |
          test -s /tmp/portfolio-site/index.html || {
            echo "::error::Refusing to deploy: index.html is missing or empty."
            exit 1
          }
          test -s /tmp/portfolio-site/bookings.html || {
            echo "::error::Refusing to deploy: bookings.html is missing or empty."
            exit 1
          }

      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID repository Actions secret."
            exit 1
          fi

          npx --yes wrangler@4 pages deploy /tmp/portfolio-site \
            --project-name=daleymottley-portfolio-fallback \
            --branch="pr-${PR_NUMBER}-preview" \
            --commit-hash="$COMMIT_SHA" \
            --commit-message="PR #${PR_NUMBER}: ${PR_TITLE}"
