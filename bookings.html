    @media(max-width:900px) and (min-width:701px){.hero{grid-template-columns:minmax(0,1fr) minmax(300px,350px);gap:28px;padding:78px 0 68px}h1{font-size:clamp(55px,7vw,82px)}.assessment-card{padding:22px}}

  <main>
    <section class="wrap hero" aria-labelledby="booking-title">
      <aside class="assessment-card" aria-labelledby="assessment-title">
        <div class="assessment-heading"><span class="form-tag" data-i18n="formTag">AI Consultation Request</span><span class="form-index" data-i18n="formIndex">01 / 01</span></div>
        <h2 id="assessment-title" data-i18n-html="formTitle">Let’s make AI useful for your business.</h2>
        <p class="form-intro" data-i18n="formIntro">Share a little about your business and what you would like to improve. I’ll review your request and get back to you about the next step.</p>
        <form class="assessment-form" id="assessment-form" data-booking-form="true">
          <label for="assessment-name"><span data-i18n="nameLabel">Your name</span><input id="assessment-name" name="name" autocomplete="name" data-i18n-placeholder="namePlaceholder" placeholder="e.g. Alex Morgan" required></label>
          <label for="assessment-email"><span data-i18n="emailLabel">Work email</span><input id="assessment-email" type="email" name="email" autocomplete="email" data-i18n-placeholder="emailPlaceholder" placeholder="you@company.com" required></label>
          <label for="assessment-business"><span data-i18n="businessLabel">Business name</span><input id="assessment-business" name="business" autocomplete="organization" data-i18n-placeholder="businessPlaceholder" placeholder="Your business" required></label>
          <label for="assessment-workflow"><span data-i18n="workflowLabel">What would you most like to improve?</span><select id="assessment-workflow" name="workflow" required><option value="" data-i18n="chooseWorkflow">Choose a workflow</option><option data-i18n="leadSales">Lead follow-up and sales</option><option data-i18n="customerService">Customer service and enquiries</option><option data-i18n="adminData">Admin and data entry</option><option data-i18n="marketingContent">Marketing and content</option><option data-i18n="clientOnboarding">Client onboarding and delivery</option><option data-i18n="reportingResearch">Reporting and research</option><option data-i18n="notSure">Not sure yet</option></select></label>
          <label for="assessment-challenge"><span data-i18n="challengeLabel">What makes this work difficult?</span><textarea id="assessment-challenge" name="challenge" rows="3" data-i18n-placeholder="challengePlaceholder" placeholder="A few details about the task or process..." required></textarea></label>
          <label for="assessment-time"><span data-i18n="timeLabel">Time spent each week</span><select id="assessment-time" name="time" required><option value="" data-i18n="chooseEstimate">Choose an estimate</option><option data-i18n="under2">Under 2 hours</option><option data-i18n="hours2to5">2–5 hours</option><option data-i18n="hours6to10">6–10 hours</option><option data-i18n="over10">More than 10 hours</option><option data-i18n="notSure">Not sure</option></select></label>
          <button class="button primary" type="submit"><span data-i18n="submitAssessment">Request my assessment</span> <span aria-hidden="true">↗</span></button>
          <p class="form-note" id="assessment-status" aria-live="polite" hidden></p>

        </form>
      </aside>
